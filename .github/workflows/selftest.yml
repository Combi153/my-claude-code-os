# This repository's own selftest, on every push and every pull request.
#
# **It needs no company environment.** `.claude/config/workspace.json` is gitignored, so a clone
# has only `workspace.example.json`; the selftest starts without it and skips the checks that
# need a bound environment, each one naming the key or the file that was absent. Nothing here
# reaches a company repository, a container or an internal host.
#
# **A skip is not a pass, and this job does not take the numbers on trust.** The summary carries
# all three counts, and `MIN_CHECKS` below is a floor under how many checks ran. Printing the
# skipped count only makes a shrinking suite *visible*; the floor makes it *caught*. The cheapest
# way to make any measurement look better is to weaken the measurement, and turning a check into
# a skip is exactly that move - so it has to be the thing that turns this job red, not a number
# somebody has to open the summary and compare against memory.
#
# **Python 3.14, and never below 3.12.** `.claude/scripts/phpmove` nests the same quote inside an
# f-string (PEP 701, new in 3.12). On 3.11 and older that is a SyntaxError, so the tool does not
# fail a case - it does not parse at all, and the error names a quote rather than a version.
# 3.14 is the version the repository is developed and verified on, so a green here means what a
# green locally means. `selftest.py` refuses to start below 3.12 and says why.
#
# Wall clock: the selftest itself is about 20 s (its nine case modules run concurrently); the
# whole job is a minute or two, most of it checkout, the interpreter and the two packages below.

name: selftest

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # **How many checks must run here.** With no `workspace.json` 25 of the 43 checks run and
      # 15 skip, so 25 is the floor: green at 25, red at 24.
      #
      # It counts checks that RAN - passed plus failed - not checks that passed. A check that
      # fails still ran, and it already turns the job red through the exit code; this floor is
      # for the other failure, the one with no red of its own: a check that quietly stopped
      # running. The two need separate reports or the second hides behind the first.
      #
      # **Raise it in the same commit that adds an environment-free check.** Having to edit this
      # line is the point - it is where a person notices that the suite changed size.
      MIN_CHECKS: 25

    steps:
      # A git working tree, because cross-check (e) sweeps `git ls-files` for retired names and
      # reports "nothing was scanned" rather than "clean" when there is no git tree to read.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # `php` and `rg` are optional for the case modules: without them those modules skip the
      # cases that need them and say so on their last line. Those skips sit *inside* a module,
      # so they never reach the parent's count and `MIN_CHECKS` cannot see them - which is why
      # **this step is not allowed to fail quietly.** A failed install would otherwise drop six
      # cases and still report a full green. An infrastructure failure is reported as an
      # infrastructure failure, naming apt, rather than as a suite that silently got smaller.
      #
      # The reverse guard - failing on any inner skip at all - is deliberately not here:
      # `selftest_context.py` skips its timing case when an empty interpreter start alone costs
      # 50 ms, which a shared runner can do under load. A floor that reds at random teaches
      # people to ignore the red, and then it guards nothing.
      - name: php-cli and ripgrep, so the cases needing them are not skipped
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli ripgrep

      - name: selftest
        id: run
        shell: bash
        run: |
          set -o pipefail
          start=$SECONDS
          set +e
          python3 .claude/scripts/selftest.py 2>&1 | tee selftest.log
          status=${PIPESTATUS[0]}
          set -e
          echo "seconds=$(( SECONDS - start ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      # Always, including after a failure: the counts are worth reading exactly then.
      - name: summary, and the floor under how many checks ran
        if: always()
        shell: bash
        run: |
          {
            echo "## selftest - ${{ steps.run.outputs.seconds }}s"
            echo
            echo '```'
            if [ -s selftest.log ]; then
              # From the separator line to the end: the three counts, then one line per skipped
              # check with the key or the file that was missing.
              awk '/^={10,}$/{f=1} f' selftest.log
            else
              echo "the selftest produced no log at all - it did not start"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          counts=$(grep -E '^[0-9]+/[0-9]+ pass' selftest.log 2>/dev/null | tail -1)
          if [ -z "$counts" ]; then
            echo "::error title=selftest::the selftest never reached its summary line, so nothing was counted at all"
            exit 1
          fi
          echo "::notice title=selftest::${counts}   (floor: ${MIN_CHECKS} checks must run)"

          passed=${counts%%/*}
          failed=$(printf '%s' "$counts" | sed -n 's/.*· \([0-9][0-9]*\) fail.*/\1/p')
          ran=$(( passed + ${failed:-0} ))
          if [ "$ran" -lt "$MIN_CHECKS" ]; then
            echo "::error title=selftest::${ran} checks ran, under the floor of ${MIN_CHECKS}." \
                 "A check that used to run no longer does - read the skipped lines in the job" \
                 "summary for which one and why. Only raise MIN_CHECKS in" \
                 ".github/workflows/selftest.yml when a check was deliberately added."
            exit 1
          fi
